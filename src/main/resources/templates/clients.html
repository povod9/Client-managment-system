<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Активный Слон - Управление</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
<div class="d-flex justify-content-between mb-4">
    <h2>Список клиентов клуба</h2>
    <a href="/ui/clients/new" class="btn btn-primary">Добавить клиента</a>
</div>

<table class="table table-striped border shadow-sm">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Email</th>
        <th>Подписка</th>
        <th>Оплата</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="client : ${clients}">
        <td th:text="${client.id}"></td>
        <td th:text="${client.firstName + ' ' + client.lastName}"></td>
        <td th:text="${client.email}"></td>
        <td><span class="badge bg-secondary" th:text="${client.subscription}"></span></td>
        <td>
            <span th:if="${client.payment.name() == 'PAYED'}" class="badge bg-success">Оплачено</span>
            <span th:if="${client.payment.name() == 'PENDING'}" class="badge bg-warning text-dark">Ожидание</span>
            <span th:if="${client.payment.name() == 'CANCEL'}" class="badge bg-danger">Отмена</span>
        </td>
        <td class="d-flex gap-2">
            <form th:if="${client.payment.name() == 'PENDING'}" th:action="@{/ui/clients/{id}/approve(id=${client.id})}" method="post">
                <button class="btn btn-sm btn-success">Оплатить</button>
            </form>
            <form th:if="${client.payment.name() == 'PENDING'}" th:action="@{/ui/clients/{id}/cancel(id=${client.id})}" method="post">
                <button class="btn btn-sm btn-outline-danger">Отмена</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
