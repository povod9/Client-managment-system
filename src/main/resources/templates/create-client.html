<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить клиента</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Регистрация нового клиента</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/ui/clients}" method="post">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Имя</label>
                        <input type="text" name="firstName" class="form-control" placeholder="Иван" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Фамилия</label>
                        <input type="text" name="lastName" class="form-control" placeholder="Иванов" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Электронная почта</label>
                    <input type="email" name="email" class="form-control" placeholder="ivan@example.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Тип абонемента</label>
                    <select name="subscription" class="form-select">
                        <option value="MONTH">Месяц</option>
                        <option value="YEAR">Год</option>
                        <option value="UNLIMITED">Безлимит</option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">Сохранить клиента</button>
                    <a href="/ui/clients" class="btn btn-outline-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
